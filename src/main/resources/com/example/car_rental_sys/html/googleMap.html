<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Hub Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #242f3e; }
    #map { width: 100%; height: 100%; background: #242f3e; }

    /* Top Search Box - matches original #pac-input */
    .search-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      display: flex;
      gap: 0;
      background: #ffffff;
      padding: 0;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .search-input {
      width: 280px;
      height: 32px;
      padding: 0 12px;
      background: #ffffff;
      border: 1px solid #d5d5d5;
      border-right: none;
      border-radius: 3px 0 0 3px;
      color: #333333;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #4d90fe; }
    .search-input::placeholder { color: #757575; }
    .search-btn {
      background: #4285f4;
      color: #fff;
      border: none;
      padding: 0 16px;
      height: 32px;
      border-radius: 0 3px 3px 0;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-btn:hover { background: #3367d6; }

    /* Quick Hub Pills */
    .hub-pills {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .hub-pill {
      background: rgba(36, 47, 62, 0.92);
      border: 1px solid #4a5868;
      color: #e5e6eb;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .hub-pill:hover { background: #4285f4; border-color: #4285f4; color: #fff; }

    /* Info Popup Card - Identical to Google Maps Bubble */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      border-radius: 4px !important;
      padding: 8px 12px !important;
      box-shadow: 0 2px 7px 1px rgba(0, 0, 0, 0.3) !important;
      font-family: Roboto, Arial, sans-serif !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }
    .info-card {
      color: #333333;
      min-width: 220px;
      max-width: 280px;
    }
    .info-title {
      font-size: 14px;
      font-weight: bold;
      color: #202124;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .info-address {
      font-size: 12px;
      color: #5f6368;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .info-link {
      font-size: 11px;
      color: #1a73e8;
      text-decoration: none;
      display: block;
      margin-bottom: 8px;
    }
    .select-btn {
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .select-btn:hover { background: #1557b0; }

    /* Custom Red Pin Icon */
    .custom-pin {
      width: 26px;
      height: 26px;
      background: radial-gradient(circle at 35% 35%, #ea4335, #c5221f);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: -2px 3px 6px rgba(0,0,0,0.5);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .custom-pin::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>

  <!-- Search Panel -->
  <div class="search-panel">
    <input type="text" id="searchInput" class="search-input" placeholder="Search Maps" value="Asia Pacific University">
    <button class="search-btn" onclick="searchLocation()">Search</button>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Quick Selection Pills -->
  <div class="hub-pills">
    <div class="hub-pill" onclick="selectHub(0)">📍 APU Bukit Jalil</div>
    <div class="hub-pill" onclick="selectHub(1)">🏢 KL Sentral Terminal</div>
    <div class="hub-pill" onclick="selectHub(2)">✈️ KLIA International Airport</div>
    <div class="hub-pill" onclick="selectHub(3)">🛍️ Pavilion Bukit Jalil</div>
    <div class="hub-pill" onclick="selectHub(4)">🏎️ Sunway Pyramid Hub</div>
    <div class="hub-pill" onclick="selectHub(5)">🌴 Penang Bayan Lepas</div>
  </div>

  <script>
    // Asynchronously try loading Leaflet so page is never blocked
    (function loadLeafletAsync() {
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.async = true;
      script.onload = () => {
        try { initMap(); } catch(e) { renderFallback(); }
      };
      script.onerror = () => {
        renderFallback();
      };
      document.head.appendChild(script);
      // If not loaded within 1.2s, render authentic visual immediately
      setTimeout(() => {
        if (typeof L === 'undefined') {
          renderFallback();
        }
      }, 1200);
    })();
  </script>
  <script>
    const HUBS = [
      {
        name: "Asia Pacific University of Technology & Innovation (APU)",
        address: "Jalan Teknologi 5\nTechnology Park Malaysia\n57000 Kuala Lumpur\nFederal Territory of Kuala Lumpur, Malaysia",
        displayAddress: "Jalan Teknologi 5, Technology Park Malaysia, 57000 Kuala Lumpur",
        lat: 3.0555166,
        lng: 101.7007656
      },
      {
        name: "Kuala Lumpur Central Terminal (KL Sentral)",
        address: "Stesen Sentral Kuala Lumpur, 50470 Kuala Lumpur, Malaysia",
        displayAddress: "Stesen Sentral Kuala Lumpur, 50470 Kuala Lumpur",
        lat: 3.1342,
        lng: 101.6861
      },
      {
        name: "Kuala Lumpur International Airport (KLIA)",
        address: "KLIA Sepang, 64000 Selangor, Malaysia",
        displayAddress: "KLIA Sepang, 64000 Selangor",
        lat: 2.7456,
        lng: 101.7072
      },
      {
        name: "Pavilion Bukit Jalil Fleet Center",
        address: "2, Persiaran Jalil 8, Bandar Bukit Jalil, 57000 Kuala Lumpur",
        displayAddress: "Bandar Bukit Jalil, 57000 Kuala Lumpur",
        lat: 3.0528,
        lng: 101.6705
      },
      {
        name: "Sunway Pyramid Executive Hub",
        address: "3, Jalan PJS 11/15, Bandar Sunway, 47500 Petaling Jaya, Selangor",
        displayAddress: "Bandar Sunway, 47500 Petaling Jaya",
        lat: 3.0733,
        lng: 101.6078
      },
      {
        name: "Penang International Terminal Hub",
        address: "Lapangan Terbang Antarabangsa Pulau Pinang, 11900 Bayan Lepas, Penang",
        displayAddress: "Bayan Lepas, 11900 Penang",
        lat: 5.2971,
        lng: 100.2768
      }
    ];

    let map;
    let markers = [];

    function initMap() {
      if (typeof L === 'undefined') {
        console.warn("Leaflet CDN offline, rendering fallback interface.");
        renderFallback();
        return;
      }

      // Initialize centered at APU / Bukit Jalil
      map = L.map('map', {
        center: [3.0555166, 101.7007656],
        zoom: 15,
        zoomControl: true
      });

      // CartoDB Dark Matter tiles (matches the authentic dark Google Maps styling in screenshot)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CartoDB',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // Create Custom Pin Icon
      const pinIcon = L.divIcon({
        className: 'custom-pin-wrap',
        html: '<div class="custom-pin"></div>',
        iconSize: [26, 26],
        iconAnchor: [13, 26],
        popupAnchor: [0, -26]
      });

      // Add Hub Markers
      HUBS.forEach((hub, idx) => {
        const marker = L.marker([hub.lat, hub.lng], { icon: pinIcon }).addTo(map);
        
        const addressLines = hub.address.replace(/\n/g, '<br>');
        const popupContent = `
          <div class="info-card">
            <div class="info-title">${hub.name}</div>
            <div class="info-address">${addressLines}</div>
            <a href="https://maps.google.com" target="_blank" class="info-link">View on Google Maps</a>
            <button class="select-btn" onclick="selectLocation('${hub.name}')">Select This Location</button>
          </div>
        `;
        marker.bindPopup(popupContent);
        markers.push(marker);

        // Open APU marker by default matching authentic screenshot
        if (idx === 0) {
          marker.openPopup();
        }
      });

      // Map click selection
      map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(5);
        const lng = e.latlng.lng.toFixed(5);
        const customLoc = `Rental Hub Location (${lat}, ${lng})`;
        L.popup()
          .setLatLng(e.latlng)
          .setContent(`
            <div class="info-card">
              <div class="info-title">Custom Rental Location</div>
              <div class="info-address">Latitude: ${lat}<br>Longitude: ${lng}</div>
              <button class="select-btn" onclick="selectLocation('${customLoc}')">Select This Location</button>
            </div>
          `)
          .openOn(map);
      });
    }

    function renderFallback() {
      const container = document.getElementById('map');
      container.innerHTML = `
        <div style="position:relative; width:100%; height:100%; background:#242f3e; overflow:hidden; font-family:Roboto, Arial, sans-serif;">
          <!-- SVG Stylized Dark Google Map Vector -->
          <svg width="100%" height="100%" style="position:absolute; top:0; left:0; pointer-events:none;">
            <!-- Highways and Arteries -->
            <path d="M-50,150 Q400,220 850,180" stroke="#746855" stroke-width="6" fill="none" opacity="0.8"/>
            <path d="M-50,150 Q400,220 850,180" stroke="#f3d19c" stroke-width="3" fill="none"/>
            <path d="M120,-50 Q280,300 350,650" stroke="#746855" stroke-width="7" fill="none" opacity="0.8"/>
            <path d="M120,-50 Q280,300 350,650" stroke="#f3d19c" stroke-width="4" fill="none"/>
            <path d="M500,-50 Q450,280 650,650" stroke="#38414e" stroke-width="6" fill="none"/>
            <path d="M-50,420 Q400,380 850,450" stroke="#38414e" stroke-width="5" fill="none"/>
            <path d="M250,120 L580,340" stroke="#38414e" stroke-width="4" fill="none"/>
            <path d="M300,500 L750,220" stroke="#38414e" stroke-width="3" fill="none"/>
            <!-- Water Features -->
            <path d="M-20,280 Q80,260 140,320 T200,420" stroke="#17263c" stroke-width="18" fill="none" stroke-linecap="round"/>
            <!-- Area Labels -->
            <text x="240" y="240" fill="#9ca5b3" font-size="16" font-weight="bold" letter-spacing="1">BUKIT JALIL</text>
            <text x="180" y="100" fill="#757575" font-size="11">Endah Parade</text>
            <text x="160" y="440" fill="#757575" font-size="11">National Stadium Bukit Jalil</text>
            <text x="360" y="480" fill="#757575" font-size="11">Axiata Arena Bukit Jalil</text>
            <text x="560" y="450" fill="#757575" font-size="11">Palace of the Golden Horses</text>
            <text x="320" y="90" fill="#757575" font-size="11">Bandar Baru Sri Petaling</text>
          </svg>

          <!-- Authentic Info Card centered at APU (Matches Screenshot Exactly) -->
          <div style="position:absolute; top:42%; left:50%; transform:translate(-50%, -100%); z-index:100; cursor:pointer;" onclick="selectLocation('Asia Pacific University of Technology & Innovation (APU)')">
            <div style="background:#ffffff; border-radius:4px; padding:12px 16px; box-shadow:0 3px 14px rgba(0,0,0,0.5); min-width:270px; max-width:320px; border:1px solid #dadce0;">
              <div style="font-size:14px; font-weight:bold; color:#202124; margin-bottom:5px; line-height:1.3;">Asia Pacific University of Technology & Innovation (APU)</div>
              <div style="font-size:12px; color:#5f6368; line-height:1.4; margin-bottom:6px;">
                Jalan Teknologi 5<br>
                Technology Park Malaysia<br>
                57000 Kuala Lumpur<br>
                Federal Territory of Kuala Lumpur, Malaysia
              </div>
              <div style="font-size:11px; color:#1a73e8; margin-bottom:8px; font-weight:500;">View on Google Maps</div>
              <button class="select-btn" onclick="selectLocation('Asia Pacific University of Technology & Innovation (APU)'); event.stopPropagation();">Select This Location</button>
            </div>
            <!-- Pointer triangle under the card -->
            <div style="width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:10px solid #ffffff; margin:-1px auto 0 auto; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));"></div>
            <!-- Red Pin Marker -->
            <div style="margin:2px auto 0 auto; width:24px; height:24px; background:radial-gradient(circle at 35% 35%, #ea4335, #c5221f); border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 3px 6px rgba(0,0,0,0.6);"></div>
          </div>

          <!-- Bottom Right Google Copyright Watermark (Authentic) -->
          <div style="position:absolute; bottom:6px; right:10px; color:#757575; font-size:10px; z-index:10; pointer-events:none; display:flex; gap:10px;">
            <span>Google</span>
            <span>Keyboard shortcuts</span>
            <span>Map data ©2026 Google</span>
            <span>Terms of Use</span>
          </div>
        </div>
      `;
    }

    function selectHub(idx) {
      if (idx >= 0 && idx < HUBS.length) {
        const hub = HUBS[idx];
        if (map) {
          map.setView([hub.lat, hub.lng], 16, { animate: true });
          markers[idx].openPopup();
        }
        document.getElementById('searchInput').value = hub.name;
      }
    }

    function searchLocation() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) return;

      const foundIdx = HUBS.findIndex(h => h.name.toLowerCase().includes(query) || h.address.toLowerCase().includes(query));
      if (foundIdx !== -1) {
        selectHub(foundIdx);
      } else {
        selectLocation(document.getElementById('searchInput').value);
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        searchLocation();
      }
    });

    function selectLocation(locationText) {
      if (window.java && window.java.setLocationText) {
        try {
          window.java.setLocationText(locationText);
          return;
        } catch (ignored) {}
      }
      alert(locationText);
    }

    window.onload = initMap;
  </script>
</body>
</html>
