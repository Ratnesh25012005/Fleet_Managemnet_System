<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Hub Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #242f3e; }
    #map { width: 100%; height: 100%; background: #242f3e; }

    /* Top Search Box */
    .search-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      background: rgba(30, 36, 48, 0.95);
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      border: 1px solid #3c4858;
    }
    .search-input {
      width: 260px;
      padding: 8px 12px;
      background: #141820;
      border: 1px solid #4a5868;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #165dff; }
    .search-input::placeholder { color: #86909c; }
    .search-btn {
      background: #165dff;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-btn:hover { background: #0e4bc7; }

    /* Quick Hub Pills */
    .hub-pills {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .hub-pill {
      background: rgba(22, 28, 38, 0.9);
      border: 1px solid #3a4756;
      color: #e5e6eb;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.2s;
    }
    .hub-pill:hover { background: #165dff; border-color: #165dff; color: #fff; }

    /* Info Popup Card */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      border-radius: 10px !important;
      padding: 6px 4px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45) !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }
    .info-card {
      padding: 8px 10px;
      color: #1d2129;
    }
    .info-title {
      font-size: 14px;
      font-weight: 700;
      color: #1d2129;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .info-address {
      font-size: 12px;
      color: #4e5969;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .info-badge {
      display: inline-block;
      background: #e8f3ff;
      color: #165dff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .select-btn {
      width: 100%;
      background: #165dff;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .select-btn:hover { background: #0e4bc7; }

    /* Custom Red Pin Icon */
    .custom-pin {
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 35% 35%, #ff4d4f, #cf1322);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: -2px 3px 8px rgba(0,0,0,0.5);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .custom-pin::after {
      content: '';
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>

  <!-- Search Panel -->
  <div class="search-panel">
    <input type="text" id="searchInput" class="search-input" placeholder="Search Maps or Hubs..." value="Asia Pacific University">
    <button class="search-btn" onclick="searchLocation()">Search</button>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Quick Selection Pills -->
  <div class="hub-pills">
    <div class="hub-pill" onclick="selectHub(0)">📍 APU Technology Park</div>
    <div class="hub-pill" onclick="selectHub(1)">🏢 KL Sentral Terminal</div>
    <div class="hub-pill" onclick="selectHub(2)">✈️ KLIA International Airport</div>
    <div class="hub-pill" onclick="selectHub(3)">🛍️ Pavilion Bukit Jalil</div>
    <div class="hub-pill" onclick="selectHub(4)">🎢 Sunway Pyramid Hub</div>
    <div class="hub-pill" onclick="selectHub(5)">🌴 Penang Bayan Lepas</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const HUBS = [
      {
        name: "Asia Pacific University of Technology & Innovation (APU)",
        address: "Jalan Teknologi 5, Technology Park Malaysia, 57000 Kuala Lumpur, Malaysia",
        badge: "Official Fleet Campus Hub",
        lat: 3.0555166,
        lng: 101.7007656
      },
      {
        name: "Kuala Lumpur Central Terminal (KL Sentral)",
        address: "Stesen Sentral Kuala Lumpur, 50470 Kuala Lumpur, Malaysia",
        badge: "Major Transit Hub",
        lat: 3.1342,
        lng: 101.6861
      },
      {
        name: "Kuala Lumpur International Airport (KLIA Terminal 1 & 2)",
        address: "KLIA Sepang, 64000 Selangor, Malaysia",
        badge: "Airport Express Hub",
        lat: 2.7456,
        lng: 101.7072
      },
      {
        name: "Pavilion Bukit Jalil Fleet Center",
        address: "2, Persiaran Jalil 8, Bandar Bukit Jalil, 57000 Kuala Lumpur",
        badge: "VIP Fleet Center",
        lat: 3.0528,
        lng: 101.6705
      },
      {
        name: "Sunway Pyramid Executive Hub",
        address: "3, Jalan PJS 11/15, Bandar Sunway, 47500 Petaling Jaya, Selangor",
        badge: "Subang Fleet Branch",
        lat: 3.0733,
        lng: 101.6078
      },
      {
        name: "Penang International Terminal Hub",
        address: "Lapangan Terbang Antarabangsa Pulau Pinang, 11900 Bayan Lepas, Penang",
        badge: "Northern Island Branch",
        lat: 5.2971,
        lng: 100.2768
      }
    ];

    let map;
    let markers = [];

    function initMap() {
      // Initialize centered at APU / Bukit Jalil
      map = L.map('map', {
        center: [3.0555166, 101.7007656],
        zoom: 15,
        zoomControl: true
      });

      // CartoDB Dark Matter tiles (matches the authentic dark Google Maps styling)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CartoDB',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // Create Custom Pin Icon
      const pinIcon = L.divIcon({
        className: 'custom-pin-wrap',
        html: '<div class="custom-pin"></div>',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });

      // Add Hub Markers
      HUBS.forEach((hub, idx) => {
        const marker = L.marker([hub.lat, hub.lng], { icon: pinIcon }).addTo(map);
        
        const popupContent = `
          <div class="info-card">
            <span class="info-badge">${hub.badge}</span>
            <div class="info-title">${hub.name}</div>
            <div class="info-address">${hub.address}</div>
            <button class="select-btn" onclick="selectLocation('${hub.name}, ${hub.address}')">Select Location</button>
          </div>
        `;
        marker.bindPopup(popupContent);
        markers.push(marker);

        // Open APU marker by default as in original screenshot
        if (idx === 0) {
          marker.openPopup();
        }
      });

      // Map click selection
      map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(5);
        const lng = e.latlng.lng.toFixed(5);
        const customLoc = `Rental Hub Location (${lat}, ${lng})`;
        L.popup()
          .setLatLng(e.latlng)
          .setContent(`
            <div class="info-card">
              <span class="info-badge">Custom Selected Point</span>
              <div class="info-title">Custom Pickup Location</div>
              <div class="info-address">Latitude: ${lat}<br>Longitude: ${lng}</div>
              <button class="select-btn" onclick="selectLocation('${customLoc}')">Confirm This Spot</button>
            </div>
          `)
          .openOn(map);
      });
    }

    function selectHub(idx) {
      if (idx >= 0 && idx < HUBS.length) {
        const hub = HUBS[idx];
        map.setView([hub.lat, hub.lng], 16, { animate: true });
        markers[idx].openPopup();
        document.getElementById('searchInput').value = hub.name;
      }
    }

    function searchLocation() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) return;

      const foundIdx = HUBS.findIndex(h => h.name.toLowerCase().includes(query) || h.address.toLowerCase().includes(query));
      if (foundIdx !== -1) {
        selectHub(foundIdx);
      } else {
        selectLocation(document.getElementById('searchInput').value);
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        searchLocation();
      }
    });

    function selectLocation(locationText) {
      // Sends data to Java WebEngine via alert handler
      alert(locationText);
    }

    window.onload = initMap;
  </script>
</body>
</html>
