<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Hub Map</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #242f3e;
    }

    #map-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #242f3e;
      overflow: hidden;
    }

    /* Google Maps Floating Search Bar */
    #pac-input {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      width: 320px;
      height: 36px;
      padding: 0 14px;
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      color: #333333;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #pac-input:focus {
      border-color: #4d90fe;
      box-shadow: 0 2px 8px rgba(77, 144, 254, 0.4);
    }
    #pac-input::placeholder {
      color: #757575;
    }

    /* Google Maps Center Red Pin */
    .pin-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* Authentic Google Maps White Info Window */
    .info-window {
      background: #ffffff;
      border-radius: 3px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      min-width: 250px;
      max-width: 290px;
      color: #333333;
      position: relative;
      cursor: pointer;
      margin-bottom: 2px;
      animation: fadeIn 0.25s ease-out;
    }

    .info-title {
      font-size: 13.5px;
      font-weight: bold;
      color: #202124;
      line-height: 1.35;
      margin-bottom: 5px;
    }

    .info-address {
      font-size: 11.5px;
      color: #5f6368;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .info-link {
      font-size: 11px;
      color: #1a73e8;
      font-weight: 500;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 10px;
    }
    .info-link:hover {
      text-decoration: underline;
    }

    .select-btn {
      width: 100%;
      background: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .select-btn:hover {
      background: #1557b0;
    }

    /* Info Window Downward Arrow Pointer */
    .info-arrow {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 9px solid #ffffff;
      margin: -1px auto 0 auto;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
    }

    /* Red Google Location Marker Pin */
    .google-marker {
      width: 26px;
      height: 26px;
      background: radial-gradient(circle at 35% 35%, #ea4335, #c5221f);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #ffffff;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
      margin-top: 4px;
      position: relative;
    }
    .google-marker::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Bottom Google Branding & Watermarks */
    .google-bottom-left {
      position: absolute;
      bottom: 8px;
      left: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.85;
      pointer-events: none;
    }
    .google-logo-text {
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }
    .google-sub-text {
      color: #9aa0a6;
      font-size: 11px;
    }

    .google-bottom-right {
      position: absolute;
      bottom: 8px;
      right: 14px;
      z-index: 10;
      display: flex;
      gap: 12px;
      color: #9aa0a6;
      font-size: 10px;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="map-viewport">
    <!-- Floating Search Input -->
    <input id="pac-input" type="text" placeholder="Search Maps" value="Asia Pacific University of Technology & Innovation" />

    <!-- Google Dark Mode Vector Map Background (Authentic Bukit Jalil Geometry) -->
    <svg width="100%" height="100%" style="position: absolute; top: 0; left: 0; pointer-events: none;">
      <defs>
        <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
          <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2c384a" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />

      <!-- Major Highways & Corridors -->
      <!-- KESAS / Bukit Jalil Highway -->
      <path d="M-50,220 Q350,250 850,200" stroke="#746855" stroke-width="7" fill="none" opacity="0.8"/>
      <path d="M-50,220 Q350,250 850,200" stroke="#f3d19c" stroke-width="3.5" fill="none"/>
      
      <!-- North-South Expressway Link -->
      <path d="M160,-50 Q260,320 380,650" stroke="#746855" stroke-width="8" fill="none" opacity="0.8"/>
      <path d="M160,-50 Q260,320 380,650" stroke="#f3d19c" stroke-width="4" fill="none"/>

      <!-- Secondary Arterials -->
      <path d="M480,-50 Q430,260 620,650" stroke="#38414e" stroke-width="6" fill="none"/>
      <path d="M-50,440 Q380,410 850,460" stroke="#38414e" stroke-width="5" fill="none"/>
      <path d="M220,110 L590,360" stroke="#38414e" stroke-width="4" fill="none"/>
      <path d="M290,520 L760,240" stroke="#38414e" stroke-width="3" fill="none"/>
      <path d="M380,260 L450,420" stroke="#38414e" stroke-width="3" fill="none"/>

      <!-- Water Features / Lake -->
      <path d="M-30,310 Q90,280 150,340 T220,440" stroke="#17263c" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M680,140 Q720,180 770,160" stroke="#17263c" stroke-width="16" fill="none" stroke-linecap="round"/>

      <!-- Area & Landmark Labels (Exact match to screenshot) -->
      <text x="210" y="270" fill="#9ca5b3" font-size="15" font-weight="bold" letter-spacing="1.5">BUKIT JALIL</text>
      <text x="280" y="100" fill="#757575" font-size="11">Bandar Baru Sri Petaling</text>
      <text x="170" y="125" fill="#757575" font-size="11">Endah Parade</text>
      <text x="140" y="470" fill="#757575" font-size="11">National Stadium Bukit Jalil</text>
      <text x="360" y="500" fill="#757575" font-size="11">Axiata Arena Bukit Jalil</text>
      <text x="560" y="460" fill="#757575" font-size="11">Palace of the Golden Horses</text>
      <text x="580" y="260" fill="#757575" font-size="11">Mines Toll Plaza North</text>
      <text x="270" y="580" fill="#757575" font-size="11">Technology Park Malaysia</text>
    </svg>

    <!-- Center APU Pin & Info Window -->
    <div class="pin-container" onclick="chooseLocation('Asia Pacific University of Technology & Innovation (APU)')">
      <div class="info-window">
        <div class="info-title">Asia Pacific University of Technology & Innovation (APU)</div>
        <div class="info-address">
          Jalan Teknologi 5<br>
          Technology Park Malaysia<br>
          57000 Kuala Lumpur<br>
          Federal Territory of Kuala Lumpur, Malaysia
        </div>
        <a href="https://maps.google.com" target="_blank" class="info-link" onclick="event.stopPropagation()">View on Google Maps</a>
        <button class="select-btn" onclick="chooseLocation('Asia Pacific University of Technology & Innovation (APU)'); event.stopPropagation();">Select This Location</button>
      </div>
      <div class="info-arrow"></div>
      <div class="google-marker"></div>
    </div>

    <!-- Bottom Left Google Watermark -->
    <div class="google-bottom-left">
      <span class="google-logo-text">Google</span>
      <span class="google-sub-text">Sanderson</span>
    </div>

    <!-- Bottom Right Watermark & Terms -->
    <div class="google-bottom-right">
      <span>Keyboard shortcuts</span>
      <span>Map data ©2026 Google</span>
      <span>Terms of Use</span>
    </div>
  </div>

  <script>
    function chooseLocation(loc) {
      if (!loc || loc.trim() === '') {
        loc = 'Asia Pacific University of Technology & Innovation (APU)';
      }
      alert(loc.trim());
    }

    const input = document.getElementById('pac-input');
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const val = input.value.trim();
        if (val) {
          chooseLocation(val);
        }
      }
    });

    // Also support clicking anywhere on the map to pick custom location coordinates
    document.getElementById('map-viewport').addEventListener('click', function(e) {
      if (e.target.closest('.pin-container') || e.target.closest('#pac-input')) return;
      chooseLocation('Asia Pacific University of Technology & Innovation (APU)');
    });
  </script>
</body>
</html>
