<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay success</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: pointer;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 22px;
            display: none;
            z-index: 10;
        }

        img {
            width: 90px;
            height: 90px;
            margin-bottom: 12px;
        }

        button {
            color: white;
            background-color: #3c7eff;
            padding: 12px 28px;
            border: none;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(60, 126, 255, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #2668f0;
            transform: scale(1.04);
        }

        p {
            margin: 8px 0;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <video id="successVideo" src="./video2.mp4" autoplay muted playsinline preload="auto"></video>
    
    <div id="container">
        <img src="success.png" alt="success">
        <p style="font-size: 26px; font-weight: bold; color: #4ade80;">Transaction Completed</p>
        <p style="color: #cbd5e1;">Your supercar is confirmed and ready for pickup!</p>
        <button onclick="buttonClickEvent()">View My Orders &rarr;</button>
    </div>

    <script>
        const video = document.getElementById('successVideo');
        const container = document.getElementById('container');

        function stopVideo() {
            if (video) {
                video.style.display = 'none';
                try { video.pause(); } catch(e) {}
            }
            if (container) {
                container.style.display = 'block';
            }
        }

        function buttonClickEvent() {
            alert("CLOSE_PAY_SUCCESS");
        }

        if (video) {
            video.muted = true;
            
            const attemptPlay = () => {
                try {
                    video.currentTime = 0;
                } catch(e) {}
                video.play().catch(e => {
                    console.log('Autoplay retry with muted:', e);
                    video.muted = true;
                    video.play();
                });
            };

            if (video.readyState >= 2) {
                attemptPlay();
            } else {
                video.addEventListener('canplay', attemptPlay, { once: true });
                video.addEventListener('loadeddata', attemptPlay, { once: true });
            }

            video.addEventListener('ended', () => {
                stopVideo();
            });

            video.addEventListener('error', (e) => {
                console.error('Video error, displaying fallback modal:', e);
                stopVideo();
            });
        }

        // Failsafe: After 15s reveal button if video hangs or finishes early
        setTimeout(() => {
            stopVideo();
        }, 15000);

        // Clicking anywhere when container is visible closes or buttonClickEvent
        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                if (container && container.style.display !== 'block') {
                    stopVideo();
                }
            }
        });
    </script>
</body>

</html>
