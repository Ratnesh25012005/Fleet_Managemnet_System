<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay success</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            -webkit-user-select: none;
            user-select: none;
            font-family: sans-serif;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 22px;
            display: none;
        }

        img {
            width: 100px;
            height: 100px;
        }

        button {
            color: white;
            background-color: #3c7eff;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 20px;
        }

        button:hover {
            background-color: #306fff;
            cursor: pointer;
        }

        p:hover {
            cursor: default;
        }
    </style>
</head>

<body>
    <video id="successVideo" src="./video2.mp4" autoplay playsinline></video>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('successVideo');
            if (video) {
                video.currentTime = 0;
                video.play().catch(e => console.log('Autoplay handled:', e));
            }
        });

        function buttonClickEvent() {
            if (window.invoke && window.invoke.world) {
                window.invoke.world();
            }
        }
    </script>
    <div id="container">
        <img src="success.png" alt="success">
        <p>Transaction completed</p>
        <p>Your car is on the way !</p>
        <button onclick="buttonClickEvent()">Check Payment</button>
    </div>

    <script>
        // Display after video (~16s)
        setTimeout(() => {
            const container = document.getElementById('container');
            if (container) container.style.display = 'block';
        }, 16000);

        function stopVideo() {
            const video = document.querySelector('video');
            if (video) video.remove();
            const container = document.getElementById('container');
            if (container) container.style.display = 'block';
        }
    </script>
</body>

</html>
